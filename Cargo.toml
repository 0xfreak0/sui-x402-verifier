[package]
name = "x402-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
envoy-types = "0.7"
hex = "0.4"
hmac = "0.12"
prost = "0.14"
rand = "0.9"
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
