# Envoy config for the local x402 end-to-end test.
#
#                                    ┌─▶ graphql.testnet.sui.io  (HTTP/JSON)
#   client ──▶ Envoy :10000 ─────────┤
#                    │               └─▶ fullnode.testnet.sui.io (gRPC/TLS)
#                    │
#                    └──ext_authz──▶ x402-verifier :50051
#
# Both upstreams are the Sui testnet itself, so the API being rate limited and
# the chain being paid on are the same network.
#
# GraphQL is the better surface for exercising x402: a 402 challenge is an
# ordinary HTTP response that curl can read directly. gRPC clients collapse a
# non-200 HTTP status into an opaque transport error, so the challenge headers
# are much harder to observe there.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # AUTO accepts both h1 (curl → GraphQL) and h2 (grpcurl → gRPC).
                codec_type: AUTO
                # One line per request, to stdout.
                #
                # %REQ()% reports the request as it arrived from downstream, not
                # as ext_proc rewrote it — so the tier here is what the CLIENT
                # claimed, which is exactly what you want to see when checking
                # that a forged `x-x402-tier` was ignored. The tier the verifier
                # actually resolved is in its own logs, not this one.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE% %DURATION%ms claimed-tier=%REQ(X-X402-TIER)% upstream=%UPSTREAM_HOST%\n"

                # SECURITY CRITICAL — this is what makes the free tier real.
                #
                # With the default (false), Envoy treats itself as an internal
                # proxy and derives the downstream remote address FROM the
                # x-forwarded-for header. That address is what feeds the
                # `source.address` attribute the verifier meters on, so any
                # client could send `X-Forwarded-For: <random>` on each request
                # and get an unlimited free tier.
                #
                # `true` makes Envoy use the real TCP peer, which a client
                # cannot forge. Correct because this Envoy IS the edge proxy.
                #
                # If you put something in front of it (an L7 load balancer,
                # Caddy), keep this true and set xff_num_trusted_hops to the
                # number of proxies you actually control — never leave the
                # decision to the client.
                use_remote_address: true
                # Trust exactly one proxy hop: Caddy, which REPLACES
                # X-Forwarded-For with the real peer, so a client-supplied
                # value never survives to be read here. The demo backend
                # forwards that header verbatim and adds nothing, so one hop
                # is the whole chain.
                #
                # Locally there is no Caddy and browsers send no XFF, so Envoy
                # falls back to the connection peer exactly as before. A
                # curious user could hand-craft an XFF against their own
                # laptop; that is not a threat model, and any deployment must
                # keep a header-sanitising proxy in front for this to hold.
                #
                # Add another proxy in front of Caddy and this number must
                # change with it, or the free tier becomes forgeable.
                xff_num_trusted_hops: 1
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: sui_testnet
                      domains: ["*"]
                      # Browsers can only read response headers that are
                      # explicitly exposed. Without expose_headers, JS sees the
                      # 402 status but NOT the challenge, the session token, or
                      # the receipt — which makes the whole flow unusable from a
                      # web page.
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex: { regex: ".*" }
                          allow_methods: "GET, POST, OPTIONS"
                          allow_headers: "content-type, payment-signature, x-payment-session, x-grpc-web, grpc-timeout, x-user-agent"
                          # grpc-status/grpc-message must be exposed too, or a
                          # grpc-web client cannot read the denial status.
                          # The meter headers must be exposed too, or a page can
                          # only discover the free-tier wall by hitting it and
                          # cannot show how much of a bought session is left.
                          expose_headers: "payment-required, payment-response, x-payment-session, grpc-status, grpc-message, x-x402-tier, x-x402-free-remaining, x-x402-free-limit, x-x402-free-reset, x-x402-session-remaining, x-x402-session-quota, x-x402-session-expires"
                          max_age: "86400"
                      routes:
                        # gRPC method paths are /<package>.<Service>/<Method>,
                        # so these prefixes cleanly separate them from GraphQL.
                        #
                        # grpc.reflection.* must be routed here too, not just
                        # sui.rpc.v2.*: grpcurl resolves method descriptors via
                        # reflection before it can issue the real call, and
                        # sending that to the GraphQL cluster fails with a
                        # confusing "server does not support the reflection API".
                        # gRPC service discovery and health, NOT gated.
                        #
                        # A gRPC client resolves method descriptors via
                        # reflection before it can issue the real call, and
                        # clients attach their headers to that call too. Gating
                        # it means the reflection request consumes the payment
                        # and the actual call is then refused as a replay —
                        # which is correct behaviour producing a useless client.
                        #
                        # Reflection is service-discovery metadata, not the paid
                        # resource, so it is exempt. The responses are small and
                        # cacheable; the resource itself stays gated below.
                        - match: { safe_regex: { regex: "^/(grpc\\.reflection|grpc\\.health)\\..*" } }
                          route:
                            cluster: sui_fullnode_grpc
                            host_rewrite_literal: fullnode.testnet.sui.io
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true

                        - match: { safe_regex: { regex: "^/sui\\.rpc\\.v2\\..*" } }
                          route:
                            cluster: sui_fullnode_grpc
                            # The upstream routes on :authority and terminates
                            # TLS for this SNI, so it must not stay
                            # "localhost:10000".
                            host_rewrite_literal: fullnode.testnet.sui.io
                            timeout: 30s
                            # Streaming is sold by duration. The verifier sets
                            # `grpc-timeout` to whatever the session has left
                            # and overwrites any client-supplied value, so the
                            # stream ends when the paid window does.
                            #
                            # This is the CEILING on what may be sold, not the
                            # duration itself — keeping the per-session value in
                            # a header is what lets one route sell a 60-second
                            # window and an hour-long one. A static
                            # max_stream_duration here would pin every session
                            # on the route to the same length.
                            max_stream_duration:
                              grpc_timeout_header_max: 3600s
                          metadata:
                            filter_metadata:
                              envoy.filters.http.ext_proc:
                                x402_policy: grpc
                          # Tell the verifier which pricing policy this route
                          # uses. Envoy stays the single source of truth for
                          # the route table; the verifier only knows what the
                          # policy *name* costs. No path prefixes are
                          # duplicated between the two configs.
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  x402_policy: grpc

                        # A genuinely free route. Same upstream and same
                        # filter chain as the priced GraphQL rule below — only
                        # the policy differs, which is what makes "free" a
                        # pricing decision rather than a bypass.
                        - match: { prefix: "/free/graphql" }
                          route:
                            cluster: sui_graphql
                            host_rewrite_literal: graphql.testnet.sui.io
                            prefix_rewrite: "/graphql"
                            timeout: 30s
                          metadata:
                            filter_metadata:
                              envoy.filters.http.ext_proc:
                                x402_policy: free
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  x402_policy: free

                        # An upstream that fails on purpose. Gated identically
                        # to everything else: the only difference is that the
                        # backend returns 503, so ext_proc's response phase
                        # discards the verified payment instead of settling it.
                        - match: { prefix: "/boom" }
                          route:
                            cluster: demo_backend
                            prefix_rewrite: "/broken"
                            timeout: 10s
                          metadata:
                            filter_metadata:
                              envoy.filters.http.ext_proc:
                                x402_policy: broken
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  x402_policy: broken

                        # An ordinary application behind the same gate, proving
                        # the upstream need not be a blockchain node at all.
                        # The demo backend serves the spin result; the gateway
                        # decides whether it is allowed to.
                        - match: { prefix: "/spin" }
                          route:
                            cluster: demo_backend
                            prefix_rewrite: "/wheel"
                            timeout: 10s
                          metadata:
                            filter_metadata:
                              envoy.filters.http.ext_proc:
                                x402_policy: spin
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  x402_policy: spin

                        # Everything else goes to GraphQL.
                        - match: { prefix: "/" }
                          route:
                            cluster: sui_graphql
                            host_rewrite_literal: graphql.testnet.sui.io
                            timeout: 30s
                          metadata:
                            filter_metadata:
                              envoy.filters.http.ext_proc:
                                x402_policy: graphql
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  x402_policy: graphql

                          # ---------------------------------------------------
                          # Descriptors for an external ratelimit service.
                          # Commented out because this demo lets the verifier
                          # enforce limits in-process. Uncomment together with
                          # a `ratelimit` http_filter once you run
                          # envoyproxy/ratelimit + Redis.
                          #
                          # These key on headers the verifier injects with
                          # OverwriteIfExistsOrAdd, so a client cannot forge
                          # its own tier.
                          # ---------------------------------------------------
                          # rate_limits:
                          #   - actions:
                          #       - request_headers:
                          #           header_name: x-x402-tier
                          #           descriptor_key: tier
                          #       - request_headers:
                          #           header_name: x-x402-payer
                          #           descriptor_key: payer
                          #           skip_if_absent: true

                http_filters:
                  # SETTLEMENT ORDERING — the choice between these two filters
                  # decides whether a client can be charged for a request the
                  # upstream then failed to serve.
                  #
                  #   ext_proc   verify on the request, settle on the RESPONSE,
                  #              and only on a 2xx. This is the sequencing
                  #              scheme_exact_sui.md actually specifies
                  #              (verify -> do the work -> settle).
                  #   ext_authz  pre-upstream only. Cannot see the response, so
                  #              it must settle before the work happens.
                  #
                  # ext_proc is enabled below. To fall back to ext_authz — for a
                  # gateway that does not support ext_proc — comment out the
                  # ext_proc filter and uncomment the ext_authz one. Do not run
                  # both: each would independently charge for the same request.
                  #
                  # ORDERING IS LOAD-BEARING, twice over:
                  #
                  # 1. cors BEFORE ext_authz. The CORS filter answers preflight
                  #    OPTIONS itself and short-circuits the chain. If ext_authz
                  #    ran first, the preflight would be metered and 402'd, and
                  #    the browser would never send the real request at all.
                  # 2. ext_authz BEFORE router (and before any ratelimit filter)
                  #    so the headers it injects exist by the time descriptors
                  #    are built.
                  # Browsers cannot speak native gRPC — fetch/XHR give no control
                  # over HTTP/2 frames, and HTTP/2 trailers are unreadable from
                  # JS. grpc-web carries trailers in the response body instead.
                  # This filter translates grpc-web <-> gRPC, so the upstream
                  # fullnode sees ordinary gRPC and needs no changes.
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      # Fail closed: if the verifier is down, deny rather than
                      # silently serving everyone at unlimited rate.
                      failure_mode_allow: false
                      # Headers only, both directions. Bodies are never sent:
                      # payment lives entirely in headers, and streaming request
                      # bodies through the verifier would add latency and memory
                      # for nothing.
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      message_timeout: 5s
                      # ext_proc does not carry the peer address in the header
                      # map the way ext_authz does, and the free tier is metered
                      # per source IP. Ask for it explicitly.
                      request_attributes:
                        - source.address
                        - xds.route_name
                        - xds.route_metadata
                      grpc_service:
                        envoy_grpc:
                          cluster_name: x402_verifier

                  # --- Fallback: pre-upstream only, settles early ------------
                  # - name: envoy.filters.http.ext_authz
                  #   typed_config:
                  #     "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  #     transport_api_version: V3
                  #     failure_mode_allow: false
                  #     grpc_service:
                  #       timeout: 5s
                  #       envoy_grpc:
                  #         cluster_name: x402_verifier

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # The demo application. Plain HTTP/1.1 on loopback: it is the "anything"
    # in "payments in front of anything", and it is deliberately unaware that
    # it is being sold — it has no payment code of its own.
    - name: demo_backend
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: demo_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8402

    # The verifier. HTTP/2 is mandatory — this is a gRPC service.
    - name: x402_verifier
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: x402_verifier
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # Use host.docker.internal if Envoy runs in Docker while
                      # the verifier runs natively on the host.
                      address: 127.0.0.1
                      port_value: 50051

    # Sui testnet GraphQL. Plain HTTP/1.1 upstream over TLS.
    - name: sui_graphql
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      # Envoy's default (AUTO) prefers AAAA. Networks running DNS64/NAT64 hand
      # back a synthesized 64:ff9b::/96 address that is unroutable without a
      # working NAT64 gateway, which shows up as a 503 "connection timeout"
      # even though IPv4 to the same host works fine.
      dns_lookup_family: V4_ONLY
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: graphql.testnet.sui.io
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/cert.pem
      load_assignment:
        cluster_name: sui_graphql
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: graphql.testnet.sui.io
                      port_value: 443

    # Sui testnet fullnode gRPC (sui.rpc.v2.*). Requires HTTP/2.
    - name: sui_fullnode_grpc
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      # See the note on sui_graphql.
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: fullnode.testnet.sui.io
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/cert.pem
      load_assignment:
        cluster_name: sui_fullnode_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: fullnode.testnet.sui.io
                      port_value: 443
